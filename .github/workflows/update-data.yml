name: 定时检查岗位流水线

# 这个 workflow 可以跑采集，但不会把抓取结果提交回仓库。
# web/public/data 与 automation/data/seed_postings.json 里是示例占位。
# cron 是 UTC，且必须写死在 YAML 里，所以这里用一个较粗的触发频率，
# 真正“什么时候该跑”由 automation/config.toml 的 [schedule] 决定：
# run --if-due 会读取用户设定的运行时间，没到点就直接跳过。
# 改完 config.toml 后可以执行 `python -m jobsinsight sync-cron`，
# 把下面这行 cron 同步成配置时间对应的 UTC 时刻。
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略配置的运行时间，立即执行一次
        type: boolean
        default: true
      limit:
        description: 本次最多处理多少个岗位（留空表示不限制）
        type: string
        default: ''

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 运行状态（上次运行时间、岗位快照）需要跨次保留，
      # 否则每次都会把所有岗位当成“今日新增”。
      - name: 恢复运行状态
        uses: actions/cache@v4
        with:
          path: automation/state
          key: jobsinsight-state-${{ github.run_id }}
          restore-keys: |
            jobsinsight-state-

      - name: 执行流水线
        working-directory: automation
        env:
          # Settings → Secrets and variables → Actions:
          #   secret  JOBSINSIGHT_LLM_API_KEY   有值才会调用 DeepSeek
          #   variable JOBSINSIGHT_LLM_PROVIDER / JOBSINSIGHT_LLM_MODEL
          # 未设置的 Variable 在 Actions 里是空字符串。配置层会忽略空白，
          # 从而保留 automation/config.toml 的 deepseek / deepseek-flash。
          # 不要在这里回退到 mock，否则密钥配了也仍走离线模型。
          # 没有密钥时流水线不发模型请求，富化和洞察回退到规则解析。
          JOBSINSIGHT_LLM_API_KEY: ${{ secrets.JOBSINSIGHT_LLM_API_KEY }}
          JOBSINSIGHT_LLM_PROVIDER: ${{ vars.JOBSINSIGHT_LLM_PROVIDER }}
          JOBSINSIGHT_LLM_MODEL: ${{ vars.JOBSINSIGHT_LLM_MODEL }}
          # Settings → Secrets → Actions: JOB51_COOKIE（已登录的 51job Cookie）。
          # 只注入环境变量。不要 echo、不要写进日志。
          JOB51_COOKIE: ${{ secrets.JOB51_COOKIE }}
        run: |
          python -m jobsinsight doctor
          python -m jobsinsight next-runs
          python -m jobsinsight run \
            --trigger github-actions \
            ${{ (github.event_name == 'schedule' || inputs.force != true) && '--if-due' || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      # 公开仓库里的 web/public/data 只保留示例占位。真实抓取留在跑
      # automation/scripts/run-local.ps1 的那台电脑上：脚本把结果写到相对路径
      # web/public/data，发信后再 git checkout 还原。不要在这里提交或推送。
      - name: 丢弃抓取结果，不写入公开仓库
        if: always()
        run: |
          git checkout -- web/public/data
          git clean -fdq -- web/public/data
          echo "未提交 web/public/data。公开 JSON 保持示例占位。"

      - name: 上传运行报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: automation/state/runs.json
          if-no-files-found: ignore
