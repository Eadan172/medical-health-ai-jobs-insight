name: 定时更新岗位数据

# cron 是 UTC，且必须写死在 YAML 里，所以这里用一个较粗的触发频率，
# 真正“什么时候该跑”由 automation/config.toml 的 [schedule] 决定：
# run --if-due 会读取用户设定的运行时间，没到点就直接跳过。
# 改完 config.toml 后可以执行 `python -m jobsinsight sync-cron`，
# 把下面这行 cron 同步成配置时间对应的 UTC 时刻。
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略配置的运行时间，立即执行一次
        type: boolean
        default: true
      limit:
        description: 本次最多处理多少个岗位（留空表示不限制）
        type: string
        default: ''

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 运行状态（上次运行时间、岗位快照）需要跨次保留，
      # 否则每次都会把所有岗位当成“今日新增”。
      - name: 恢复运行状态
        uses: actions/cache@v4
        with:
          path: automation/state
          key: jobsinsight-state-${{ github.run_id }}
          restore-keys: |
            jobsinsight-state-

      - name: 执行流水线
        working-directory: automation
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置，
          # 不配置也能跑：会自动退回规则解析。
          JOBSINSIGHT_LLM_API_KEY: ${{ secrets.JOBSINSIGHT_LLM_API_KEY }}
          JOBSINSIGHT_LLM_PROVIDER: ${{ vars.JOBSINSIGHT_LLM_PROVIDER }}
          JOBSINSIGHT_LLM_MODEL: ${{ vars.JOBSINSIGHT_LLM_MODEL }}
        run: |
          python -m jobsinsight next-runs
          python -m jobsinsight run \
            --trigger github-actions \
            ${{ (github.event_name == 'schedule' || inputs.force != true) && '--if-due' || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

      - name: 提交数据变更
        run: |
          if [ -z "$(git status --porcelain web/public/data)" ]; then
            echo "数据没有变化，无需提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git commit -m "chore(data): 自动更新岗位数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: 上传运行报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: automation/state/runs.json
          if-no-files-found: ignore
