# 医药健康 + AI 岗位洞察 —— 自动化配置
#
# 校验配置：      python -m jobsinsight config
# 查看运行时间：  python -m jobsinsight next-runs
# 立即运行一次：  python -m jobsinsight run
#
# 字符串里可以用 ${ENV_VAR} 或 ${ENV_VAR:-默认值} 引用环境变量，
# 也可以用 JOBSINSIGHT_* 环境变量覆盖（见 README）。

log_level = "INFO"


# ---------------------------------------------------------------------------
# 运行时间：由你自己定
#   mode = "daily"    每天定点，用 daily_times
#   mode = "cron"     cron 表达式，用 cron
#   mode = "interval" 固定间隔，用 interval_minutes
#   mode = "manual"   不自动运行，只接受手动 / 接口触发
# ---------------------------------------------------------------------------
[schedule]
enabled = true
mode = "daily"
timezone = "Asia/Shanghai"
daily_times = ["00:00"]        # 例：["00:00", "12:30"] 每天两次
cron = "0 0 * * *"             # 例："30 */6 * * 1-5" 工作日每 6 小时
interval_minutes = 360         # mode = "interval" 时生效
jitter_seconds = 0             # 触发时随机延迟，避免整点集中请求
catch_up = true                # 进程重启后补跑错过的窗口
run_on_start = false           # 启动时立刻跑一次


# ---------------------------------------------------------------------------
# LLM 调用接口
# provider 可选：openai / deepseek / moonshot(kimi) / dashscope(qwen) /
#                zhipu / siliconflow / groq / ollama / openai_compatible /
#                anthropic(claude) / mock
# 定时任务和手动 run 默认调用 DeepSeek。密钥只放环境变量，不要写进本文件。
# 未设置 JOBSINSIGHT_LLM_API_KEY 时不会发模型请求，富化和洞察回退到规则解析。
# 离线测试：JOBSINSIGHT_LLM_PROVIDER=mock JOBSINSIGHT_LLM_MODEL=mock-1
#
# base_url 用本仓库 OpenAI 兼容客户端的 DeepSeek 地址。客户端请求
# {base_url}/chat/completions，因此这里是 https://api.deepseek.com/v1
# （与 provider = "deepseek" 的内置别名相同），不是不带 /v1 的主机名。
# ---------------------------------------------------------------------------
[llm]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
# api_key 建议放环境变量，不要写进仓库
api_key = "${JOBSINSIGHT_LLM_API_KEY:-}"
base_url = "https://api.deepseek.com/v1"
timeout_seconds = 60
max_retries = 3
backoff_seconds = 1.5
min_interval_seconds = 0       # 两次请求之间的最小间隔，用于避开限流
temperature = 0.2
max_tokens = 4096
max_jobs_per_run = 60          # 每次运行送入 LLM 的岗位上限，0 表示不限
batch_size = 8                 # 单次请求合并的岗位数
enrich_jobs = true             # 用 LLM 规范化岗位字段
generate_insights = true       # 用 LLM 生成每日洞察


# 换厂商时改 provider / model / base_url，密钥仍走环境变量：
#
# [llm]
# provider = "moonshot"
# model = "moonshot-v1-8k"
# api_key = "${MOONSHOT_API_KEY}"
#
# [llm]
# provider = "openai_compatible"
# model = "qwen2.5-72b-instruct"
# base_url = "http://your-gateway/v1"
# api_key = "${LLM_API_KEY}"


# ---------------------------------------------------------------------------
# 数据来源，可以配置多个 [[sources]]
# type = "fixture"  读取本地 JSON（离线可用，默认）
# type = "json_api" 任意 JSON 接口，字段通过 options.field_map 映射
# type = "html_llm" 抓网页 + 让 LLM 抽取结构化岗位
# type = "browser"  用已授权的 Playwright 登录会话读取动态页面
# ---------------------------------------------------------------------------
[[sources]]
name = "seed"
type = "fixture"
enabled = true
# required = true              # 失败/空结果时拒绝发布，保留上一版数据
# min_collected = 20           # 低于预期条数时视为来源失败
path = "automation/data/seed_postings.json"
limit = 500

[[sources]]
name = "job-discovery"
type = "search_discovery"
enabled = true
required = false
platform = "search"
limit = 30

[sources.options]
config = "automation/config/sources.yaml"
queries = "automation/config/job_queries.yaml"
max_queries = 2
detail_limit = 4

[[sources]]
name = "company-careers"
type = "company_careers"
enabled = true
required = false
platform = "企业招聘"
limit = 30

[sources.options]
config = "automation/config/company_sources.yaml"

