# ---------------------------------------------------------------------------
# 产出
# ---------------------------------------------------------------------------
[output]
data_dir = "web/public/data"    # 前端读取的目录
state_dir = "automation/state"  # 运行状态、历史、快照
keep_runs = 50
min_relevance = 30              # 相关度低于该值的岗位会被丢弃（0-100）
max_jobs = 1000
write_insights = true


# ---------------------------------------------------------------------------
# HTTP 接口（python -m jobsinsight serve）
# ---------------------------------------------------------------------------
[server]
host = "127.0.0.1"
port = 8787
auth_token = "${JOBSINSIGHT_API_TOKEN:-}"   # 非空时写操作需要 Bearer token
cors_origin = "*"
serve_web_dist = true
