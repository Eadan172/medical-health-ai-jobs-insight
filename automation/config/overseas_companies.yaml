# 海外公司公开 ATS 职位板（无需 API key）
#
# 调研同事可以按同样的格式追加公司。每家公司一行映射，只认这四个字段：
#   name    展示用公司名
#   ats     greenhouse | lever | ashby | workable
#   token   职位板标识。Greenhouse board token、Lever site、Ashby board name、Workable subdomain
#   sector  行业短词，例如 AI制药、临床AI、医学影像AI、数字健康
#
# 公开接口：
#   greenhouse  https://boards-api.greenhouse.io/v1/boards/{token}/jobs?content=true
#   lever       https://api.lever.co/v0/postings/{token}?mode=json
#   ashby       https://api.ashbyhq.com/posting-api/job-board/{token}?includeCompensation=true
#   workable    https://apply.workable.com/api/v1/widget/accounts/{token}
#
# 一家公司只保留一行。Doctolib 只用 Greenhouse（token: doctolib），不要再加 Lever / Ashby / Workable。
# 采集器按标题优先留下 AI / ML / 数据 / 科研 / 工程岗位，并限制每家公司的条数。
# 名单来源：2026-10-15 公开接口实测，HTTP 200 且有岗位。

